definitions:
  config:
    /hst:hst/hst:configurations/hst:default/hst:catalog/brxm-discovery-catalog:
      jcr:primaryType: hst:containeritempackage
      /product-recommendations:
        jcr:primaryType: hst:containeritemcomponent
        hst:componentclassname: org.bloomreach.forge.discovery.site.component.DiscoveryProductRecommendationComponent
        hst:iconpath: images/brxm-discovery/catalog-component-icons/brxdis-recommendations.svg
        hst:label: Discovery Product Recommendations
        hst:template: brxdis-recommendations-product
        hst:xtype: hst.Item
        hst:parameternames: [document, limit, showPrice, showDescription]
        hst:parametervalues: ['', '8', 'true', 'false']
      /category-recommendations:
        jcr:primaryType: hst:containeritemcomponent
        hst:componentclassname: org.bloomreach.forge.discovery.site.component.DiscoveryCategoryRecommendationComponent
        hst:iconpath: images/brxm-discovery/catalog-component-icons/brxdis-recommendations.svg
        hst:label: Discovery Category Recommendations
        hst:template: brxdis-recommendations-category
        hst:xtype: hst.Item
        hst:parameternames: [document, limit, showPrice, showDescription]
        hst:parametervalues: ['', '8', 'true', 'false']
      /global-recommendations:
        jcr:primaryType: hst:containeritemcomponent
        hst:componentclassname: org.bloomreach.forge.discovery.site.component.DiscoveryGlobalRecommendationComponent
        hst:iconpath: images/brxm-discovery/catalog-component-icons/brxdis-recommendations.svg
        hst:label: Discovery Recommendations - Trending / Personalized
        hst:template: brxdis-recommendations-global
        hst:xtype: hst.Item
        hst:parameternames: [document, limit, showPrice, showDescription]
        hst:parametervalues: ['', '8', 'true', 'false']
      /product-detail:
        jcr:primaryType: hst:containeritemcomponent
        hst:componentclassname: org.bloomreach.forge.discovery.site.component.DiscoveryProductDetailComponent
        hst:iconpath: images/brxm-discovery/catalog-component-icons/brxdis-product-detail.svg
        hst:label: Discovery Product Detail
        hst:template: brxdis-product-detail
        hst:xtype: hst.Item
      /category-highlight:
        jcr:primaryType: hst:containeritemcomponent
        hst:componentclassname: org.bloomreach.forge.discovery.site.component.DiscoveryCategoryHighlightComponent
        hst:iconpath: images/brxm-discovery/catalog-component-icons/brxdis-category-highlight.svg
        hst:label: Discovery Category Highlight
        hst:template: brxdis-category-highlight
        hst:xtype: hst.Item
        hst:parameternames: [document1, document2, document3, document4]
        hst:parametervalues: ['', '', '', '']
      /product-highlight:
        jcr:primaryType: hst:containeritemcomponent
        hst:componentclassname: org.bloomreach.forge.discovery.site.component.DiscoveryProductHighlightComponent
        hst:iconpath: images/brxm-discovery/catalog-component-icons/brxdis-product-highlight.svg
        hst:label: Discovery Product Highlight
        hst:template: brxdis-product-highlight
        hst:xtype: hst.Item
        hst:parameternames: [document1, document2, document3, document4]
        hst:parametervalues: ['', '', '', '']
      /product-grid-search:
        jcr:primaryType: hst:containeritemcomponent
        hst:componentclassname: org.bloomreach.forge.discovery.site.component.DiscoverySearchGridComponent
        hst:iconpath: images/brxm-discovery/catalog-component-icons/brxdis-search.svg
        hst:label: Discovery Product Grid - Search
        hst:template: brxdis-results
        hst:xtype: hst.Item
        hst:parameternames: [pageSize, defaultSort, catalogName,
                              statsFields, segment, exclusionFilter,
                              showFacets, showPagination, showSort, showDidYouMean, autoRedirect]
        hst:parametervalues: ['12', '', '', '', '', '',
                               'true', 'true', 'true', 'true', 'false']
      /product-grid-category:
        jcr:primaryType: hst:containeritemcomponent
        hst:componentclassname: org.bloomreach.forge.discovery.site.component.DiscoveryCategoryGridComponent
        hst:iconpath: images/brxm-discovery/catalog-component-icons/brxdis-category.svg
        hst:label: Discovery Product Grid - Category
        hst:template: brxdis-results
        hst:xtype: hst.Item
        hst:parameternames: [document, pageSize, defaultSort,
                              statsFields, segment, exclusionFilter,
                              showFacets, showPagination, showSort]
        hst:parametervalues: ['', '12', '', '', '', '',
                               'true', 'true', 'true']
      /search-input:
        jcr:primaryType: hst:containeritemcomponent
        hst:componentclassname: org.bloomreach.forge.discovery.site.component.DiscoverySearchInputComponent
        hst:iconpath: images/brxm-discovery/catalog-component-icons/brxdis-search.svg
        hst:label: Discovery Search Input
        hst:template: brxdis-search-input
        hst:xtype: hst.Item
        hst:parameternames: [placeholder, resultsPage, suggestionsEnabled, suggestionsLimit,
                              minChars, debounceMs]
        hst:parametervalues: ['Search...', '', 'true', '5', '2', '250']
