group-recommendation.group=Recommendations
group-recommendation.advanced.group=Advanced

document.hint=Pick a recommendation document that references the Discovery widget to use.
limit.hint=Maximum number of recommended products to show.
showPrice.hint=Display the product price on each recommendation card.
showDescription.hint=Display the product description on each recommendation card.
useProductDetailContext.hint=When checked, this widget reads the product shown by a Product Detail \
  component on this page and recommends similar items. The Product Detail component must appear \
  above this one in the layout.
contextProductId.hint=Explicit product ID to recommend against. Overrides automatic detection. \
  Leave blank for auto.
contextProductPidProperty.hint=JCR property name for product ID resolution from the page content \
  bean. Only change if your content model uses a custom property. Default: brxdis:pid
