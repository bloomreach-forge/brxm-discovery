group-search.input.group=Search Input
group-search.input.advanced.group=Advanced

placeholder.hint=Placeholder text shown in the search box before the visitor types.
resultsPage.hint=Relative path to the search results page (e.g. "/search"). Leave blank to submit to the current page.
suggestionsEnabled.hint=Show a dropdown of search suggestions as the visitor types.
suggestionsLimit.hint=Maximum number of suggestions shown in the dropdown.
minChars.hint=Minimum characters typed before suggestions appear.
debounceMs.hint=Milliseconds to wait after the visitor stops typing before fetching suggestions. Higher values reduce API calls but feel slower.
