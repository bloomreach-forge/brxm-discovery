group-results.content.group=Content
group-results.display.group=Display
group-results.advanced.group=Advanced

dataSource.hint=Choose between keyword search or category browse as the data source.
document.hint=Category document to browse. Only used when Data source is set to "category".
pageSize.hint=Number of products shown per page.
defaultSort.hint=Sort order applied when no sort is selected by the visitor. Leave blank for relevance.
catalogName.hint=Discovery catalog name. Leave blank for the default product catalog.
statsFields.hint=Comma-separated field names for Discovery stats (e.g. "price,sale_price"). For developer use.
segment.hint=Discovery visitor segment identifier. For developer use.
exclusionFilter.hint=Discovery exclusion filter query expression (efq). For developer use.
showFacets.hint=Show the facet filter panel alongside results.
showPagination.hint=Show page navigation below results.
showSort.hint=Show the sort dropdown above results.
showDidYouMean.hint=Show spelling correction suggestions when Discovery detects a likely typo.
autoRedirect.hint=Automatically redirect when Discovery returns a spelling correction instead of showing suggestions.
